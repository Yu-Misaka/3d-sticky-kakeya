name: Blueprint

on:
  push:
    branches: [main]
    paths:
      - 'blueprint/**'
      - 'README.md'
      - '.github/workflows/blueprint.yml'
  pull_request:
    paths:
      - 'blueprint/**'
      - 'README.md'
      - '.github/workflows/blueprint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueprint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: blueprint/requirements.txt
      - name: Install TeX and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            latexmk ghostscript dvisvgm poppler-utils graphviz libgraphviz-dev pkg-config
      - name: Install blueprint tools
        run: python -m pip install -r blueprint/requirements.txt
      - name: Build and check the site
        run: python blueprint/scripts/build.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: blueprint/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
